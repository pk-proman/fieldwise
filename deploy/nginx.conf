# Reverse proxy in front of Fieldwise (TLS is mandatory: browsers only allow GPS and camera on HTTPS).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=intake:10m rate=600r/m;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server { listen 80; server_name fieldwise.example.com; return 301 https://$host$request_uri; }

server {
    listen 443 ssl http2;
    server_name fieldwise.example.com;
    ssl_certificate     /etc/letsencrypt/live/fieldwise.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fieldwise.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;              # receipts, PO scans, photos
    gzip on; gzip_types application/json text/css application/javascript image/svg+xml;

    location /api/auth/ { limit_req zone=auth burst=10 nodelay; proxy_pass http://127.0.0.1:8000; include /etc/nginx/proxy_params; }
    location /api/intake/ { limit_req zone=intake burst=200 nodelay; proxy_pass http://127.0.0.1:8000; include /etc/nginx/proxy_params; }
    location /api/ws/ {                    # live location stream
        proxy_pass http://127.0.0.1:8000; include /etc/nginx/proxy_params;
        proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_read_timeout 3600s;
    }
    location / { proxy_pass http://127.0.0.1:8000; include /etc/nginx/proxy_params; }
}
# /etc/nginx/proxy_params should set: Host, X-Real-IP, X-Forwarded-For, X-Forwarded-Proto $scheme
