services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment: { POSTGRES_DB: fieldwise, POSTGRES_USER: fieldwise, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}" }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U fieldwise"], interval: 10s, timeout: 5s, retries: 10 }
  app:
    build: .
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://fieldwise:${POSTGRES_PASSWORD}@db:5432/fieldwise
    volumes: [uploads:/data/uploads]
    ports: ["127.0.0.1:${HOST_PORT:-8000}:8000"]   # only the reverse proxy talks to it; HOST_PORT picks a free port on a shared server
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment: { PGPASSWORD: "${POSTGRES_PASSWORD}", PGHOST: db, PGUSER: fieldwise, PGDATABASE: fieldwise, KEEP_DAYS: "14" }
    volumes: [backups:/backups, ./deploy/backup.sh:/backup.sh:ro]
    entrypoint: ["sh", "-c", "while true; do sh /backup.sh; sleep 86400; done"]
volumes: { pgdata: {}, uploads: {}, backups: {} }
